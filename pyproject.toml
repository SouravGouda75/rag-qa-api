[project]
name = "rag-api"
version = "0.1.0"
description = "Reliable RAG API with FastAPI, LangChain, Chroma, and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.5.2",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "sentence-transformers>=3.1.1",
    "pymupdf>=1.24.10",
    "markdown>=3.7",
    "langdetect>=1.0.9",
    "chardet>=5.2.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.2",
    "pyyaml>=6.0.1",
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]
